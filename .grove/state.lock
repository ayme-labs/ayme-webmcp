y Y-02 status=active t_created=2026-08-27T14:40:25Z t_updated=2026-08-27T14:40:25Z "Framework lifecycle owns Page Object disposal"
  tags: Page Object
  surface: packages/webmcp-vue, apps/example-vue/src/ayme/useAymeExperiment.ts
