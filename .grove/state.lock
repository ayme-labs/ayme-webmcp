q Q-01 status=deferred cynefin=complicated t_created=2026-08-27T12:43:03Z t_updated=2026-08-27T14:13:29Z "Choose the public activation interface"
  why:
    | The spike useAymePage function combines Vue lifecycle management with framework-neutral runtime behavior. W-02 separates those responsibilities but intentionally does not choose the final public interface.
  exit:
    | Compare an explicit runtime object with a direct activation function against the packaged implementation, then agree on naming, disposal, and whether one activation may manage several Page Objects.

q Q-02 status=answered cynefin=complicated t_created=2026-08-31T19:05:06Z t_updated=2026-09-01T04:27:24Z "Choose the compact structural output contract"
  why:
    | The first integration needs one accepted representative output before its renderer and golden test are implemented.
  hypothesis:
    | Use the Ayme experiment's ref-first tree syntax and add /pom only on explicit registered roots.
  exit:
    | Record the accepted literal example and map it to a golden integration test.
  outcome:
    | Render ref-first compact StructuralTree output. The first literal contract is: - [ref=e1] listitem:; child - /pom: ListPage.items[0]; child - [ref=e2] button "Archive item-1". Emit /pom only for explicit nested Page Object roots.

q Q-03 status=answered cynefin=complicated t_created=2026-08-31T19:05:06Z t_updated=2026-09-01T04:27:25Z "Choose multiple POM root match behavior"
  why:
    | PR 9 decides live tool availability by root count but does not decide how several matched elements map into structural state.
  hypothesis:
    | Decorate every matched occurrence with a real Playwright ref and synthesize a ref only when one eligible omitted root resolves uniquely.
  exit:
    | Record accepted behavior for zero, one, and multiple matches with observable and omitted roots.
  outcome:
    | Resolve collection members to their existing indexed component paths. For every indexed or singular root: zero matches are absent, exactly one observable match is decorated, and multiple matches are ambiguous and absent. A uniquely resolved eligible ARIA-omitted root may receive a synthetic ref.

q Q-04 status=open cynefin=complicated t_created=2026-09-05T11:41:47Z t_updated=2026-09-05T11:41:47Z "Choose navigation compatibility boundary"
  why:
    | The current adapter runs inside the document that genuine navigation would replace, while synthetic navigation would not preserve Playwright semantics.
  hypothesis:
    | Navigation should remain unsupported until evidence justifies either a deliberate emulation contract or a harness architecture change.
  exit:
    | Compare the remaining navigation-blocked tests after browser-native work and present concrete implementation options and semantic differences to the user.

q Q-05 status=open cynefin=complicated t_created=2026-09-05T11:41:47Z t_updated=2026-09-05T11:41:47Z "Choose handle compatibility boundary"
  why:
    | Some Page methods return JSHandle or ElementHandle objects whose complete public behavior would expand beyond the current Page and Locator implementation boundary.
  hypothesis:
    | Serializable callback results can be supported without committing to general handle compatibility.
  exit:
    | Identify the remaining tests that require handle identity or methods and present the smallest viable boundary to the user.

b B-01 status=validated cynefin=complicated t_created=2026-08-31T13:49:50Z t_updated=2026-08-31T13:49:50Z "Vue 3.2.0 supports lifecycle integration"
  vm:
    | Run the Vue package typecheck and lifecycle tests against exact Vue 3.2.0, 3.3.0, 3.4.0, 3.5.29, and 3.5.42.
  threshold:
    | Every exact version passes typechecking and all three lifecycle tests.
  result:
    | Every exact version passed typechecking and all three lifecycle tests in an isolated checkout at commit 4f510a0.

b B-02 status=validated cynefin=complicated t_created=2026-09-02T13:55:47Z t_updated=2026-09-02T13:55:48Z "Existing capture and reconciliation seams support session continuity"
  vm:
    | Inspect browser capture output, changed-ref reconciliation links, ambiguity behavior, and current-tree projection tests.
  threshold:
    | The existing interfaces expose current ref-to-element associations and one-to-one before-state links without changing matching heuristics.
  result:
    | Capture exposes refsByElement; reconciliation exposes getBeforeNode for changed refs and add-remove outcomes for ambiguous candidates.

