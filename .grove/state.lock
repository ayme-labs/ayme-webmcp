d D-01 status=superseded t_created=2026-08-27T08:43:08Z t_updated=2026-08-27T11:48:35Z "Use the five-workspace monorepo layout"
  context:
    | The open-source WebMCP library needs independently publishable core and Vite packages, a private example application, and shared tooling configuration.
  options:
    | OC1: Create the agreed five workspaces now and add others when migration requires them.
    | OC2: Start with one package and split it later.
    | OC3: Create all anticipated loaders and marketplace packages now.
  decision:
    | Use pnpm and Turbo with apps/example-vue, packages/webmcp, packages/webmcp-vite, packages/typescript-config, and packages/eslint-config.
    | Only packages/webmcp and packages/webmcp-vite are public-ready; the remaining workspaces are private.
  consequences:
    | The two library packages can be published independently later.
    | The repository carries only the package boundaries needed for the first slice.
  validation:
    | pnpm lists exactly the five agreed workspaces, and every root check passes.

d D-02 status=accepted t_created=2026-08-27T08:43:10Z t_updated=2026-08-27T08:43:22Z "Use Devbox and Corepack for local runtimes"
  context:
    | The repository should align with Ayme local environment management while keeping its runtime configuration minimal.
  options:
    | OC1: Use Devbox with Node 24 and Corepack with an exact pnpm version.
    | OC2: Use Node version files without Devbox.
    | OC3: Depend on system runtimes.
  decision:
    | Use nodejs@24, set DEVBOX_COREPACK_ENABLED=true, declare an exact pnpm 11 version in the root packageManager field, and commit devbox.lock.
  consequences:
    | The repository does not add .nvmrc or .node-version.
    | The repository does not copy Ayme-specific Git, uv, or NODE_OPTIONS configuration.
  validation:
    | devbox run -- node --version and devbox run -- pnpm --version report the declared runtime families.

d D-03 status=accepted t_created=2026-08-27T08:43:12Z t_updated=2026-08-27T08:43:22Z "Keep Vitest configuration package-local"
  context:
    | Turbo should execute each workspace test task, but a shared Vitest configuration package is unnecessary at the current repository size.
  options:
    | OC1: Keep Vitest configuration in each applicable workspace.
    | OC2: Configure Vitest projects at the repository root.
    | OC3: Create a shared Vitest configuration package.
  decision:
    | The example application and both public packages own their Vitest configuration, with no root or shared Vitest configuration package.
  consequences:
    | A small amount of configuration duplication is accepted.
    | Empty public package shells do not receive fake tests.
  validation:
    | The root test command runs package tasks, and the real example application test passes.

d D-04 status=accepted t_created=2026-08-27T08:43:14Z t_updated=2026-08-27T08:43:22Z "Enforce dependency direction with Turbo Boundaries"
  context:
    | The monorepo needs lightweight enforcement of the agreed dependency direction.
  options:
    | OC1: Use the built-in experimental Turbo Boundaries feature.
    | OC2: Add custom ESLint or Nx-style boundary tooling.
    | OC3: Leave dependency direction unenforced.
  decision:
    | Tag tooling, core, adapter, and app workspaces and configure Turbo Boundaries rules.
    | Tooling cannot depend on core, adapter, or app workspaces; core cannot depend on adapter or app workspaces; adapter cannot depend on app workspaces; app may depend on core and adapter workspaces.
  consequences:
    | The repository uses an experimental Turbo feature whose configuration may evolve.
  validation:
    | turbo boundaries passes, and configuration review confirms the intended rules.

