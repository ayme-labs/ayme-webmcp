w W-20 type=bug status=done cynefin=complicated t_created=2026-09-03T10:57:18Z t_updated=2026-09-03T11:13:59Z "Make continuous ref resolution merge-safe"
  goals: G-10
  fitness: G-10=+0
  surface: packages/webmcp/src/pageState.ts, packages/webmcp/src/ayme.test.ts, packages/webmcp/src/ayme.browser.test.ts, packages/webmcp/package.json, packages/structural-observation/src/StructuralTree.ts, packages/structural-observation/src/StructuralTree.test.ts
  ac:
    | Synthetic refs allocated by one Document session never collide across captures.
    | A historical synthetic ref follows an unambiguous matched POM root, while removed and ambiguous roots never resolve to an unrelated element.
    | An observed alias cannot be silently reassigned to a different session identity.
    | The WebMCP Chromium session scenario is isolated and runs through the root pnpm check merge gate.
    | Renderer-sensitive expectations use the compact syntax from current main.
  repro:
    | With a fresh synthetic allocator per capture, removing the first omitted POM root reuses its ref for the next root; exact-ref precedence then resolves the historical ref to the wrong DOM element. The Chromium session tests are also excluded from every task reached by pnpm check.
  evidence_strategy:
    | Add public-facade regressions for synthetic removal, continuity, reordering, and ambiguity; run WebMCP unit and Chromium suites, then the full pnpm check on the rebased branch.
  evidence:
    | pnpm check passed after rebasing onto origin/main: all builds, lint, typechecks, unit tests, 9 example Playwright tests, the WebMCP Chromium session test, formatting, and package boundaries are green.
    | Public facade regression proves synthetic roots retain identity through reordering; removing Account leaves historical s_1/s_3 unresolved while historical Billing s_2/s_4 resolves to current s_5. StructuralTree also tests raw after-ref lineage directly.
    | PageStateSession now owns one monotonic synthetic allocator, alias rebinding throws an invariant error, dead per-identity alias sets are removed, and ambiguity is queried without exposing a collection.
  plan:
    | Own synthetic allocation in PageStateSession, expose fresh-after-ref reconciliation lineage, fail closed on alias collisions, consolidate the Chromium session scenario, and register it as the WebMCP test:e2e task.
  why:
    | This repairs correctness and validation of the already-verified Page State Session outcome without expanding its public API.

