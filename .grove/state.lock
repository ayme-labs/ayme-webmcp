q Q-01 status=deferred cynefin=complicated t_created=2026-08-27T12:43:03Z t_updated=2026-08-27T14:13:29Z "Choose the public activation interface"
  why:
    | The spike useAymePage function combines Vue lifecycle management with framework-neutral runtime behavior. W-02 separates those responsibilities but intentionally does not choose the final public interface.
  exit:
    | Compare an explicit runtime object with a direct activation function against the packaged implementation, then agree on naming, disposal, and whether one activation may manage several Page Objects.

q Q-02 status=answered cynefin=complicated t_created=2026-08-31T19:05:06Z t_updated=2026-09-01T04:27:24Z "Choose the compact structural output contract"
  why:
    | The first integration needs one accepted representative output before its renderer and golden test are implemented.
  hypothesis:
    | Use the Ayme experiment's ref-first tree syntax and add /pom only on explicit registered roots.
  exit:
    | Record the accepted literal example and map it to a golden integration test.
  outcome:
    | Render ref-first compact StructuralTree output. The first literal contract is: - [ref=e1] listitem:; child - /pom: ListPage.items[0]; child - [ref=e2] button "Archive item-1". Emit /pom only for explicit nested Page Object roots.

q Q-03 status=answered cynefin=complicated t_created=2026-08-31T19:05:06Z t_updated=2026-09-01T04:27:25Z "Choose multiple POM root match behavior"
  why:
    | PR 9 decides live tool availability by root count but does not decide how several matched elements map into structural state.
  hypothesis:
    | Decorate every matched occurrence with a real Playwright ref and synthesize a ref only when one eligible omitted root resolves uniquely.
  exit:
    | Record accepted behavior for zero, one, and multiple matches with observable and omitted roots.
  outcome:
    | Resolve collection members to their existing indexed component paths. For every indexed or singular root: zero matches are absent, exactly one observable match is decorated, and multiple matches are ambiguous and absent. A uniquely resolved eligible ARIA-omitted root may receive a synthetic ref.

