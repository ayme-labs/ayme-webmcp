y Y-03 status=superseded t_created=2026-09-02T09:50:35Z t_updated=2026-09-02T13:37:32Z "Synthetic roots are observation-only"
  tags: Structural Page State, Structural Ref, Page Object Root
  surface: packages/structural-observation/src, packages/webmcp/src
  invariant:
    | Structural Page State keeps a captured top-level document's observable hierarchy separate from Page Object decoration. A synthetic Structural Ref identifies a Page Object Root omitted from the distilled tree, carries page-state identity and Page Object association only, and must not represent ARIA semantics or Playwright actionability.
  revalidation:
    | 2026-09-02T13:37:05Z from=D-12

y Y-04 status=active t_created=2026-09-02T13:37:31Z t_updated=2026-09-02T13:37:32Z "Synthetic roots remain observation-only"
  tags: Structural Page State, Structural Ref, Page State Session, Page Object Root
  surface: packages/structural-observation/src, packages/webmcp/src
  invariant:
    | Structural Page State keeps a captured top-level document's observable hierarchy separate from Page Object decoration. A synthetic Structural Ref may resolve to its known Page Object Root DOM element within a Page State Session, but does not represent ARIA semantics or Playwright actionability.

