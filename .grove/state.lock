    | Integrated clean package cut and exact 47-member BrowserPage/BrowserLocator selection; compile-time signatures enforce exactly 13 Page and 34 Locator members. Restored exhaustive catalog to 118 Full, 5 Partial, and 62 Unsupported with current support separate. Deterministic Page/Locator surface fingerprint and pinned 24-file generated-runtime fingerprints verify. Package 20/20 unit-contract tests and 8/8 Chromium parity tests pass; unplugin 14/14 tests and example 1/1 unit plus 5/5 E2E tests pass. Full pnpm run check passed before main rebase; independent Standards and Spec remediation reviews report no findings.
    | Post-rebase remediation verified the public unplugin pack excludes @ayme-dev/playwright-browser imports and dependency metadata; the canonical Page/Locator surface is now resolved from @playwright/test exports with inherited members and fingerprint sha256:614480ae0d18f583f75f1358bf3813e984e98ef2fec83bc4a9f160f0793b4268; generated-runtime provenance shares the canonical upstream version; derived locator composition passes direct Playwright comparison. Full pnpm run check passes with 20/20 package unit-contract tests, 9/9 Chromium parity tests, 14/14 unplugin tests, and 6/6 example E2E tests.
    | Merged main's independent Playwright capture extraction into the private package behind @ayme-dev/playwright-browser/capture while keeping the root BrowserPage/BrowserLocator entry isolated and the official generated runtime separate. Full pnpm run check passes after reconciliation: 20/20 package unit-contract tests, 1/1 capture browser test, 9/9 Chromium parity tests, 14/14 unplugin tests, 6/6 example E2E tests, formatting, and Turbo boundaries.
    | Closed capture provenance gap: upstream metadata now records the fork repository, exact commit, artifact path, bytes, and SHA; the build plugin derives and asserts both the manifest dependency and artifact fingerprint from that record. Added a focused regression test. Final workspace build, lint, typecheck, tests (21 package unit, 1 capture browser, 9 Chromium parity, 14 unplugin, 6 example E2E), formatting, boundaries, diff, and Grove checks pass.

