name: Prepare Lite migration
on:
  push:
    branches: [work/prepare-lite-migration]
permissions:
  contents: write
concurrency:
  group: prepare-lite-migration
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'ayme-labs/ayme-webmcp' && github.ref == 'refs/heads/work/prepare-lite-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LEFTHOOK: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: jetify-com/devbox-install-action@v0.12.0
        with:
          enable-cache: true
          disable-nix-access-token: true
      - name: Replace the workspace adapter
        run: |
          python3 <<'PY'
          import json, re, shutil, subprocess, urllib.request
          from pathlib import Path
          fork = 'b8021fb06a7f4a5a54ab7e261761f65d32d30a60'
          dependency = 'github:ayme-labs/playwright-lite#' + fork
          for f in ['packages/webmcp/package.json', 'apps/example-vue/package.json']:
              p = Path(f)
              data = json.loads(p.read_text())
              for section in ['dependencies', 'devDependencies']:
                  if '@ayme-dev/playwright-browser' in data.get(section, {}):
                      del data[section]['@ayme-dev/playwright-browser']
                      data[section]['@ayme-dev/playwright-lite'] = dependency
              p.write_text(json.dumps(data, indent=2) + '\n')
          for f in ['packages/webmcp/src/registry.test.ts', 'packages/webmcp/src/webMcp.test.ts']:
              p = Path(f)
              s = p.read_text()
              s = s.replace('import { LOCATOR_BRAND } from "@ayme-dev/playwright-browser";', '''const { testLocators } = vi.hoisted(() => ({ testLocators: new WeakSet<object>() }));
          vi.mock("@ayme-dev/playwright-lite/internal", async (importOriginal) => ({
            ...(await importOriginal<typeof import("@ayme-dev/playwright-lite/internal")>()),
            isPlaywrightLiteLocator: (value: unknown) =>
              typeof value === "object" && value !== null && testLocators.has(value),
            resolveLocatorElements: () => [],
          }));''')
              s, count = re.subn(r'  loc\[LOCATOR_BRAND\] = Object\.freeze\(\{.*?\n  \}\);', '  testLocators.add(loc);', s, count=1, flags=re.S)
              assert count == 1, f
              p.write_text(s)
          files = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          for f in files:
              if f.startswith('packages/playwright-browser/') or not f.endswith('.ts'):
                  continue
              p = Path(f)
              if not p.exists():
                  continue
              s = p.read_text()
              def imports(match):
                  names = [x.strip() for x in match.group(1).split(',') if x.strip()]
                  result = []
                  if 'createPage' in names:
                      names.remove('createPage')
                      location = './browserPage' if f.startswith('packages/webmcp/src/') else '@ayme-dev/playwright-lite'
                      result.append('import { createPage } from "' + location + '";')
                  if names:
                      result.append('import { ' + ', '.join(names) + ' } from "@ayme-dev/playwright-lite/internal";')
                  return '\n'.join(result)
              s = re.sub(r'import\s*\{([^{}]+)\}\s*from "@ayme-dev/playwright-browser";', imports, s)
              s = s.replace('vi.mock("@ayme-dev/playwright-browser"', 'vi.mock("@ayme-dev/playwright-lite/internal"')
              s = s.replace('isAymeLocator', 'isPlaywrightLiteLocator')
              if f == 'packages/webmcp/tsdown.config.ts':
                  s = s.replace('"@ayme-dev/playwright-browser"', '"@ayme-dev/playwright-lite"')
              if f == 'packages/webmcp/src/packedConsumer.test.ts':
                  s = s.replace('  "@ayme-dev/playwright-browser",', '  "@ayme-dev/playwright-browser",\n  "@ayme-dev/playwright-lite",')
              if f == 'apps/example-vue/src/ayme/useDemoTrace.ts':
                  s = s.replace('import { createPage } from "@ayme-dev/playwright-lite";', 'import { createRuntimeSession } from "@ayme-dev/webmcp/internal";')
                  s = s.replace('withDemoFeedback(createPage(),', 'withDemoFeedback(createRuntimeSession().page,')
              if s != p.read_text():
                  p.write_text(s)
          Path('packages/webmcp/src/browserPage.ts').write_text('''import { createPage as createBrowserPage } from "@ayme-dev/playwright-lite";

          declare const __AYME_PLAYWRIGHT_TEST_ID_ATTRIBUTE__: string | undefined;
          declare const __AYME_PLAYWRIGHT_ACTION_TIMEOUT__: number | undefined;
          declare const __AYME_PLAYWRIGHT_NAVIGATION_TIMEOUT__: number | undefined;

          // Resolve compiler settings at browser Page creation, never during SSR import.
          export function createPage() {
            return createBrowserPage({
              testIdAttribute: typeof __AYME_PLAYWRIGHT_TEST_ID_ATTRIBUTE__ === "string"
                ? __AYME_PLAYWRIGHT_TEST_ID_ATTRIBUTE__ : undefined,
              actionTimeout: typeof __AYME_PLAYWRIGHT_ACTION_TIMEOUT__ === "number"
                ? __AYME_PLAYWRIGHT_ACTION_TIMEOUT__ : undefined,
              navigationTimeout: typeof __AYME_PLAYWRIGHT_NAVIGATION_TIMEOUT__ === "number"
                ? __AYME_PLAYWRIGHT_NAVIGATION_TIMEOUT__ : undefined,
            });
          }
          ''')
          Path('packages/webmcp/src/browserPage.test.ts').write_text('''import { afterEach, expect, it, vi } from "vitest";
          const { createBrowserPage } = vi.hoisted(() => ({ createBrowserPage: vi.fn(() => ({})) }));
          vi.mock("@ayme-dev/playwright-lite", () => ({ createPage: createBrowserPage }));
          import { createPage } from "./browserPage";

          afterEach(() => { vi.unstubAllGlobals(); vi.clearAllMocks(); });

          it("does not create a browser Page during import", () => {
            expect(createBrowserPage).not.toHaveBeenCalled();
          });
          it("uses runtime defaults without compiler settings", () => {
            createPage();
            expect(createBrowserPage).toHaveBeenCalledWith({
              testIdAttribute: undefined, actionTimeout: undefined, navigationTimeout: undefined,
            });
          });
          it("passes configured test IDs and explicit zero timeouts without losing them", () => {
            vi.stubGlobal("__AYME_PLAYWRIGHT_TEST_ID_ATTRIBUTE__", "data-pom");
            vi.stubGlobal("__AYME_PLAYWRIGHT_ACTION_TIMEOUT__", 0);
            vi.stubGlobal("__AYME_PLAYWRIGHT_NAVIGATION_TIMEOUT__", 37);
            createPage();
            expect(createBrowserPage).toHaveBeenCalledWith({
              testIdAttribute: "data-pom", actionTimeout: 0, navigationTimeout: 37,
            });
          });
          ''')
          p = Path('pnpm-workspace.yaml')
          p.write_text(p.read_text().replace('allowBuilds:\n', 'allowBuilds:\n  "@ayme-dev/playwright-lite": true\n'))
          p = Path('.github/workflows/ci.yml')
          s = p.read_text().replace('name: playwright-browser-report', 'name: browser-test-results').replace('path: packages/playwright-browser/test-results/report.json', 'path: |\n            packages/webmcp/test-results\n            apps/*/test-results')
          p.write_text(s)
          p = Path('.prettierignore')
          p.write_text('\n'.join(line for line in p.read_text().splitlines() if 'packages/playwright-browser/' not in line and 'Pinned upstream Playwright contract' not in line) + '\n')
          p = Path('README.md')
          s = p.read_text()
          start = s.index('`createPage()` from `@ayme-dev/playwright-browser`')
          end = s.index('\n\nThe Vue example', start)
          s = s[:start] + '''WebMCP bundles its browser controller from the exact-commit-pinned
          `@ayme-dev/playwright-lite` fork. Consumers do not install the Git dependency
          or build the runtime. It controls the current document, without opening a
          tab or creating an isolated browser context.

          Existing Vite plugin settings are passed to `createPage(options)` inside
          WebMCP. Browser Page construction remains lazy for server rendering.
          Page Object Models still use the standard Playwright Page and Locator types.''' + s[end:]
          s = s.replace('(packages/playwright-browser/compatibility/api.ts)', '(https://github.com/ayme-labs/playwright-lite/blob/' + fork + '/compatibility/api.ts)')
          p.write_text(s)
          p = Path('packages/webmcp/THIRD_PARTY_NOTICES.txt')
          extra = '\n\n=== Bundled Ayme Playwright Lite fork ===\nSource: https://github.com/ayme-labs/playwright-lite/tree/' + fork + '\n'
          for name in ['LICENSE', 'THIRD_PARTY_NOTICES.txt', 'LICENSES/YAML-LICENSE.txt']:
              url = 'https://raw.githubusercontent.com/ayme-labs/playwright-lite/' + fork + '/' + name
              extra += '\n--- ' + name + ' ---\n' + urllib.request.urlopen(url).read().decode()
          p.write_text(p.read_text() + extra)
          shutil.rmtree('packages/playwright-browser')
          PY
      - name: Install and prepare inside Devbox
        run: |
          devbox run -- bash <<'SCRIPT'
          set -euo pipefail
          pnpm install --no-frozen-lockfile --store-dir "$RUNNER_TEMP/lite-store"
          git diff --name-only --diff-filter=ACM -z | xargs -0 pnpm exec prettier --write
          pnpm exec prettier --write packages/webmcp/src/browserPage.ts packages/webmcp/src/browserPage.test.ts
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'refactor(webmcp): use the commit-pinned Playwright Lite fork'
          git push origin HEAD:work/prepare-lite-migration
          git log -1 --format='PREPARED_COMMIT %H%nPREPARED_TREE %T'
          pnpm --filter @ayme-dev/example-next exec playwright install --with-deps chromium
          pnpm check > "$RUNNER_TEMP/migration-check.log" 2>&1 || { tail -n 120 "$RUNNER_TEMP/migration-check.log"; exit 1; }
          tail -n 80 "$RUNNER_TEMP/migration-check.log"
          SCRIPT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-check-results
          path: |
            ${{ runner.temp }}/migration-check.log
            packages/webmcp/test-results
            apps/*/test-results
          if-no-files-found: ignore
