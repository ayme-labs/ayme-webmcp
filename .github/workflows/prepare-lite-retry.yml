name: Prepare Lite migration
on:
  push:
    branches: [work/prepare-lite-migration]
permissions:
  contents: write
concurrency:
  group: prepare-lite-migration
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'ayme-labs/ayme-webmcp' && github.ref == 'refs/heads/work/prepare-lite-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEFTHOOK: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: jetify-com/devbox-install-action@v0.12.0
        with:
          enable-cache: true
          disable-nix-access-token: true
      - name: Pin the consumer-check fix without changing runtime behavior
        run: |
          python3 <<'PY'
          from pathlib import Path
          old = '44af2734713027f734dfdcdd8e92b51cad9a9652'
          new = 'c90da7139d51a8940fce8dcf22e04e9c7e88c1cd'
          for f in ['packages/webmcp/package.json', 'apps/example-vue/package.json', 'pnpm-workspace.yaml', 'README.md', 'packages/webmcp/THIRD_PARTY_NOTICES.txt']:
              p = Path(f)
              s = p.read_text()
              assert old in s, f
              p.write_text(s.replace(old, new))
          PY
          devbox run -- bash <<'SCRIPT'
          set -euo pipefail
          pnpm install --no-frozen-lockfile --store-dir "$RUNNER_TEMP/lite-store"
          pnpm exec prettier --write packages/webmcp/package.json apps/example-vue/package.json pnpm-lock.yaml pnpm-workspace.yaml README.md
          git add packages/webmcp/package.json apps/example-vue/package.json pnpm-lock.yaml pnpm-workspace.yaml README.md packages/webmcp/THIRD_PARTY_NOTICES.txt
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: pin the final fork integration commit'
          git push origin HEAD:work/prepare-lite-migration
          git log -1 --format='PREPARED_COMMIT %H%nPREPARED_TREE %T'
          SCRIPT
