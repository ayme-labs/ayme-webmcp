name: Prepare Lite migration
on:
  push:
    branches: [work/prepare-lite-migration]
permissions:
  contents: write
concurrency:
  group: prepare-lite-migration
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'ayme-labs/ayme-webmcp' && github.ref == 'refs/heads/work/prepare-lite-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LEFTHOOK: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: jetify-com/devbox-install-action@v0.12.0
        with:
          enable-cache: true
          disable-nix-access-token: true
      - name: Refresh the exact fork commit
        run: |
          python3 <<'PY'
          from pathlib import Path
          for f in ['packages/webmcp/package.json', 'apps/example-vue/package.json', 'pnpm-workspace.yaml', 'README.md', 'packages/webmcp/THIRD_PARTY_NOTICES.txt']:
              p = Path(f)
              s = p.read_text()
              assert '5a66acf73a6ef24de4cb570e9f550ba96d298982' in s, f
              p.write_text(s.replace('5a66acf73a6ef24de4cb570e9f550ba96d298982', '44af2734713027f734dfdcdd8e92b51cad9a9652'))
          PY
      - name: Install and verify inside Devbox
        run: |
          devbox run -- bash <<'SCRIPT'
          set -euo pipefail
          pnpm install --no-frozen-lockfile --store-dir "$RUNNER_TEMP/lite-store"
          git diff --name-only --diff-filter=ACM -z | xargs -0 pnpm exec prettier --write --ignore-unknown
          git add packages/webmcp/package.json apps/example-vue/package.json pnpm-lock.yaml pnpm-workspace.yaml README.md packages/webmcp/THIRD_PARTY_NOTICES.txt
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: pin the reviewed browser bridge build'
          git push origin HEAD:work/prepare-lite-migration
          git log -1 --format='PREPARED_COMMIT %H%nPREPARED_TREE %T'
          pnpm --filter @ayme-dev/example-next exec playwright install --with-deps chromium
          pnpm check > "$RUNNER_TEMP/migration-check.log" 2>&1 || { tail -n 120 "$RUNNER_TEMP/migration-check.log"; exit 1; }
          tail -n 80 "$RUNNER_TEMP/migration-check.log"
          SCRIPT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-check-results
          path: |
            ${{ runner.temp }}/migration-check.log
            packages/webmcp/test-results
            apps/*/test-results
          if-no-files-found: ignore
