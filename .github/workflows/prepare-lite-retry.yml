name: Prepare Lite migration
on:
  push:
    branches: [work/prepare-lite-migration]
permissions:
  contents: write
concurrency:
  group: prepare-lite-migration
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'ayme-labs/ayme-webmcp' && github.ref == 'refs/heads/work/prepare-lite-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LEFTHOOK: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: jetify-com/devbox-install-action@v0.12.0
        with:
          enable-cache: true
          disable-nix-access-token: true
      - name: Verify source-path comments and preserve strict dependency guards
        run: |
          devbox run -- bash <<'SCRIPT'
          set -euo pipefail
          pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/lite-store"
          pnpm exec turbo run build --filter=@ayme-dev/webmcp...
          python3 <<'PY'
          from pathlib import Path
          matches = []
          for p in Path('packages/webmcp/dist').glob('*.mjs'):
              for n, line in enumerate(p.read_text().splitlines(), 1):
                  if '@ayme-dev/playwright-lite' in line:
                      print('PRIVATE_REFERENCE', p.name, n, line[:1000])
                      matches.append(line)
          assert matches, 'Expected to reproduce the private-reference guard failure'
          assert all(line.lstrip().startswith('//#region ') for line in matches), 'Unexpected reference: inspect before changing build configuration'
          p = Path('packages/webmcp/tsdown.config.ts')
          source = p.read_text()
          old = '  clean: true,\n'
          assert source.count(old) == 1
          source = source.replace(old, old + '  // Omit build-machine source paths, not copyright or license comments.\n  inputOptions: { experimental: { attachDebugInfo: "none" } },\n')
          p.write_text(source)
          PY
          pnpm exec prettier --write packages/webmcp/tsdown.config.ts
          pnpm exec turbo run build --filter=@ayme-dev/webmcp...
          pnpm --filter @ayme-dev/webmcp exec vitest run src/packedConsumer.test.ts
          git add packages/webmcp/tsdown.config.ts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(webmcp): omit private source paths from bundled output'
          git push origin HEAD:work/prepare-lite-migration
          git log -1 --format='PREPARED_COMMIT %H%nPREPARED_TREE %T'
          pnpm --filter @ayme-dev/example-next exec playwright install --with-deps chromium
          pnpm check > "$RUNNER_TEMP/migration-check.log" 2>&1 || { tail -n 120 "$RUNNER_TEMP/migration-check.log"; exit 1; }
          tail -n 80 "$RUNNER_TEMP/migration-check.log"
          SCRIPT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-check-results
          path: |
            ${{ runner.temp }}/migration-check.log
            packages/webmcp/test-results
            apps/*/test-results
          if-no-files-found: ignore
