name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Lint commits
        if: github.event_name == 'pull_request'
        run: pnpm run commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
      - run: pnpm run check

  vue-compatibility:
    name: Vue 3.2 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - name: Install with Vue 3.2.0
        run: |
          pnpm --dir packages/webmcp-vue pkg set devDependencies.vue=3.2.0
          pnpm install --no-frozen-lockfile
      - name: Build core package
        run: pnpm --filter @ayme-dev/webmcp build
      - name: Typecheck Vue package
        run: pnpm --filter @ayme-dev/webmcp-vue typecheck
      - name: Test Vue package
        run: pnpm --filter @ayme-dev/webmcp-vue test
