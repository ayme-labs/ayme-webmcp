name: Verify PR 56 presence candidate
on:
  push:
    branches: [chore/56-presence-verification]
permissions:
  contents: write
  actions: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Cancel superseded verification runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const headers = {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json'};
          const base = 'https://api.github.com/repos/ayme-labs/ayme-webmcp/actions';
          const response = await fetch(`${base}/workflows/tmp-offline-pr56.yml/runs?branch=chore%2F56-presence-verification`, {headers});
          if (!response.ok) throw new Error(`List verification runs: ${response.status}`);
          for (const run of (await response.json()).workflow_runs) {
            if (String(run.id) === process.env.GITHUB_RUN_ID || run.status === 'completed') continue;
            const result = await fetch(`${base}/runs/${run.id}/cancel`, {method: 'POST', headers});
            console.log(`Cancel superseded verification ${run.id}: ${result.status}`);
          }
          JS
      - run: corepack enable
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Apply exact locally tested patches
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc .github/pr56-presence.patch.gz > "$RUNNER_TEMP/pr56.patch"
          cp .github/pr56-modal-wrapper.patch "$RUNNER_TEMP/modal-wrapper.patch"
          echo "b72574196b508af818753e79a95478eed50186792cba8c9988b8f92a42514573  $RUNNER_TEMP/pr56.patch" | sha256sum -c -
          git checkout --detach 205a0e3193d09a672eb3ccf8e60498a5bdc39d75
          git apply --check "$RUNNER_TEMP/pr56.patch"
          git apply "$RUNNER_TEMP/pr56.patch"
          git apply --check "$RUNNER_TEMP/modal-wrapper.patch"
          git apply "$RUNNER_TEMP/modal-wrapper.patch"
          if git diff --name-only | grep -v '^packages/webmcp/src/'; then exit 1; fi
          test -z "$(git diff --name-only -- packages/playwright-browser)"
      - run: pnpm install --frozen-lockfile
      - name: Repository builds and unit tests
        shell: bash
        run: |
          set -o pipefail
          pnpm exec turbo run build lint typecheck test 2>&1 | tee "$RUNNER_TEMP/pr56-check.log"
      - name: Relevant browser and example suites
        shell: bash
        run: |
          set -o pipefail
          pnpm exec turbo run test:e2e --filter='!@ayme-dev/playwright-browser' 2>&1 | tee -a "$RUNNER_TEMP/pr56-check.log"
      - run: pnpm run format:check
      - run: pnpm run boundaries
      - name: Publish verified candidate only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/webmcp/src
          git -c core.hooksPath=/dev/null commit -m 'fix(webmcp): separate structural presence from availability'
          pnpm run commitlint --from 205a0e3193d09a672eb3ccf8e60498a5bdc39d75 --to HEAD
          git push origin HEAD:refs/heads/chore/56-presence-final-candidate
          git rev-parse HEAD
          git diff --stat 205a0e3193d09a672eb3ccf8e60498a5bdc39d75
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr56-presence-checks
          path: ${{ runner.temp }}/pr56-check.log
          retention-days: 1
