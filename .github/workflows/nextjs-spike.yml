name: Next.js spike

on:
  push:
    branches:
      - codex/nextjs-turbopack-spike
  workflow_dispatch:

concurrency:
  group: nextjs-spike-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/codex/nextjs-turbopack-spike'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEFTHOOK: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jetify-com/devbox-install-action@v0.12.0
        with:
          enable-cache: true
          disable-nix-access-token: true
      - name: Verify inside Devbox
        run: |
          devbox run -- bash <<'SCRIPT'
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec turbo run build --filter=@ayme-dev/example-next... --filter=@ayme-dev/example-react...
          pnpm --filter @ayme-dev/unplugin-webmcp test
          pnpm --filter @ayme-dev/unplugin-webmcp typecheck
          pnpm --filter @ayme-dev/unplugin-webmcp lint
          pnpm --filter @ayme-dev/example-next typecheck
          pnpm --filter @ayme-dev/example-next lint
          pnpm --filter @ayme-dev/example-next exec playwright install --with-deps chromium
          pnpm --filter @ayme-dev/example-next test:e2e
          pnpm --filter @ayme-dev/example-react test:e2e
          pnpm run format:check
          pnpm run boundaries
          SCRIPT
      - name: Upload browser failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-spike-results
          path: |
            apps/example-next/test-results
            apps/example-react/test-results
          if-no-files-found: ignore
